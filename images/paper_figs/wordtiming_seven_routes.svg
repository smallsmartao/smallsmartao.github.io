<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".12"/></filter>
    <style>
      .title{font:700 38px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0f172a}
      .sub{font:400 20px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#475569}
      .band{font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:white}
      .cardTitle{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0f172a}
      .cardText{font:400 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}
      .num{font:800 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:white}
    </style>
  </defs>
  <rect width="1400" height="880" rx="28" fill="url(#bg)"/>
  <text x="70" y="70" class="title">Word Timing 的七条技术路线</text>
  <text x="70" y="108" class="sub">差别不在最终都输出 start/end，而在“时间证据从哪里来、由谁施加单调约束”</text>

  <rect x="55" y="150" width="300" height="190" rx="22" fill="#2563eb" filter="url(#shadow)"/>
  <text x="82" y="198" class="band">A. 路径搜索型</text>
  <text x="82" y="237" class="band" opacity=".8">给定文本约束</text>
  <text x="82" y="276" class="band" opacity=".8">在帧级得分上找路径</text>
  <path d="M305 300h-180" stroke="white" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  <circle cx="140" cy="300" r="7" fill="white"/><circle cx="210" cy="300" r="7" fill="white"/><circle cx="280" cy="300" r="7" fill="white"/>

  <g filter="url(#shadow)"><rect x="390" y="150" width="440" height="190" rx="22" fill="white"/></g>
  <circle cx="435" cy="195" r="24" fill="#2563eb"/><text x="428" y="203" class="num">1</text>
  <text x="475" y="203" class="cardTitle">音素模型 + Viterbi / WFST</text>
  <text x="425" y="250" class="cardText">MFA、Kaldi：词典/G2P → 音素状态图</text>
  <text x="425" y="284" class="cardText">边界来自最佳 HMM 状态路径</text>
  <text x="425" y="318" class="cardText">强约束、可解释；资源和 OOV 成本高</text>

  <g filter="url(#shadow)"><rect x="865" y="150" width="480" height="190" rx="22" fill="white"/></g>
  <circle cx="910" cy="195" r="24" fill="#0ea5e9"/><text x="903" y="203" class="num">2</text>
  <text x="950" y="203" class="cardTitle">CTC + 受约束对齐</text>
  <text x="900" y="250" class="cardText">NFA、WhisperX：blank/repeat 拓展图</text>
  <text x="900" y="284" class="cardText">Viterbi / trellis / DTW 恢复单调路径</text>
  <text x="900" y="318" class="cardText">易复用 ASR；峰值位置不等于真实边界</text>

  <rect x="55" y="380" width="300" height="190" rx="22" fill="#7c3aed" filter="url(#shadow)"/>
  <text x="82" y="428" class="band">B. 对齐矩阵型</text>
  <text x="82" y="467" class="band" opacity=".8">从 decoder–audio</text>
  <text x="82" y="506" class="band" opacity=".8">软对应关系中取路径</text>
  <path d="M130 535l45-45 42 30 55-68" stroke="white" stroke-width="5" fill="none" stroke-linecap="round" opacity=".9"/>

  <g filter="url(#shadow)"><rect x="390" y="380" width="455" height="190" rx="22" fill="white"/></g>
  <circle cx="435" cy="425" r="24" fill="#7c3aed"/><text x="428" y="433" class="num">3</text>
  <text x="475" y="433" class="cardTitle">Attention + DTW</text>
  <text x="425" y="480" class="cardText">Whisper：软相关矩阵</text>
  <text x="425" y="514" class="cardText">head 筛选/滤波后找单调路径</text>
  <text x="425" y="548" class="cardText">无需额外模型；边界未受监督</text>

  <g filter="url(#shadow)"><rect x="875" y="380" width="470" height="190" rx="22" fill="white"/></g>
  <circle cx="920" cy="425" r="24" fill="#8b5cf6"/><text x="913" y="433" class="num">4</text>
  <text x="960" y="433" class="cardTitle">目标词活动 + DTW</text>
  <text x="910" y="480" class="cardText">TWAD：词 embedding × 声学帧</text>
  <text x="910" y="514" class="cardText">监督 frame × word 活动矩阵</text>
  <text x="910" y="548" class="cardText">无词典；训练仍需词级边界</text>

  <rect x="55" y="610" width="300" height="215" rx="22" fill="#059669" filter="url(#shadow)"/>
  <text x="82" y="658" class="band">C. 模型输出 / 内部信号</text>
  <text x="82" y="697" class="band" opacity=".8">把时间写进训练目标</text>
  <text x="82" y="736" class="band" opacity=".8">或读取单调识别轨迹</text>
  <rect x="87" y="768" width="215" height="18" rx="9" fill="white" opacity=".35"/>
  <circle cx="145" cy="777" r="10" fill="white"/><circle cx="245" cy="777" r="10" fill="white"/>

  <g filter="url(#shadow)"><rect x="390" y="610" width="300" height="215" rx="22" fill="white"/></g>
  <circle cx="430" cy="651" r="23" fill="#059669"/><text x="423" y="659" class="num">5</text>
  <text x="468" y="659" class="cardTitle">直接边界预测</text>
  <text x="420" y="705" class="cardText">Qwen3-ForcedAligner</text>
  <text x="420" y="737" class="cardText">[time] slot → 离散时间索引</text>
  <text x="420" y="769" class="cardText">显式监督，NAR 并行</text>
  <text x="420" y="801" class="cardText">依赖边界标签/伪标签</text>

  <g filter="url(#shadow)"><rect x="720" y="610" width="300" height="215" rx="22" fill="white"/></g>
  <circle cx="760" cy="651" r="23" fill="#f59e0b"/><text x="753" y="659" class="num">6</text>
  <text x="798" y="659" class="cardTitle">生成时间 Token</text>
  <text x="750" y="705" class="cardText">Whisper / Canary</text>
  <text x="750" y="737" class="cardText">文本序列中自回归发射时间</text>
  <text x="750" y="769" class="cardText">输出统一、易做多任务</text>
  <text x="750" y="801" class="cardText">量化误差与序列耦合</text>

  <g filter="url(#shadow)"><rect x="1050" y="610" width="295" height="215" rx="22" fill="white"/></g>
  <circle cx="1090" cy="651" r="23" fill="#ef4444"/><text x="1083" y="659" class="num">7</text>
  <text x="1128" y="659" class="cardTitle">内部定位信号</text>
  <text x="1080" y="705" class="cardText">CIF fire / RNN-T emission</text>
  <text x="1080" y="737" class="cardText">读取识别过程中的触发位置</text>
  <text x="1080" y="769" class="cardText">流式、低附加开销</text>
  <text x="1080" y="801" class="cardText">触发时刻未必是声学边界</text>
</svg>
